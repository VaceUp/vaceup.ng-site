name: Backend regression tests

on:
  push:
    branches: [master, main, 'codex/**']
  pull_request:
    branches: [master, main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-password-only
          MYSQL_DATABASE: vaceup_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-password-only"
          --health-interval=10s --health-timeout=5s --health-retries=15
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-only-key-not-a-production-secret-at-least-32-bytes
      DB_NAME: vaceup_ci
      DB_USER: root
      DB_PASSWORD: ci-password-only
      DB_HOST: 127.0.0.1
      REDIS_URL: ''
      CELERY_BROKER_URL: memory://
      CELERY_RESULT_BACKEND: cache+memory://
      SENTRY_DSN: ''
      VACEUP_INFRASTRUCTURE: database
      WEBSOCKETS_ENABLED: 'False'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt cryptography
      - name: Python syntax
        run: python -m compileall -q apps config
      - name: SQLite suite
        if: matrix.database == 'sqlite'
        run: |
          python manage.py makemigrations --check --dry-run --settings=config.settings_test
          python manage.py test --settings=config.settings_test --noinput
      - name: MySQL suite and concurrent-worker checks
        if: matrix.database == 'mysql'
        run: python manage.py test --settings=config.settings_test_mysql --noinput
