name: Deploy to Cloudflare

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

env:
  NODE_VERSION: '20'
  FRONTEND_DIR: 'frontend'

jobs:
  # Build and test frontend
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint || true

      - name: Build frontend (static export)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.vaceup.ng

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ${{ env.FRONTEND_DIR }}/out/
          retention-days: 1

  # Deploy to Cloudflare Pages
  deploy-pages:
    needs: build-frontend
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ${{ env.FRONTEND_DIR }}/out/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: vaceup-ng
          directory: ${{ env.FRONTEND_DIR }}/out
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}

  # Deploy API Proxy Worker
  deploy-worker:
    needs: build-frontend
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy API Proxy Worker
        run: |
          cd worker
          wrangler deploy --config ../wrangler-worker.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Notify deployment status
  notify:
    needs: [deploy-pages, deploy-worker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: https://vaceup-ng.pages.dev" >> $GITHUB_STEP_SUMMARY
          echo "- API Proxy: https://api.vaceup.ng (via Worker)" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: https://api.vaceup.ng (Truehost Cloud)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Architecture" >> $GITHUB_STEP_SUMMARY
          echo "1. **Cloudflare Pages** hosts the static Next.js frontend" >> $GITHUB_STEP_SUMMARY
          echo "2. **Cloudflare Worker** proxies `/api/*` requests to Truehost backend" >> $GITHUB_STEP_SUMMARY
          echo "3. **Truehost Cloud** runs the Django backend at api.vaceup.ng" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Configure custom domain `vaceup.ng` in Cloudflare Pages dashboard" >> $GITHUB_STEP_SUMMARY
          echo "2. Configure custom domain `api.vaceup.ng` for Worker in Cloudflare dashboard" >> $GITHUB_STEP_SUMMARY
          echo "3. Set DNS records in Cloudflare to point to Pages/Worker" >> $GITHUB_STEP_SUMMARY