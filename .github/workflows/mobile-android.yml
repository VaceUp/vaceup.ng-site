name: VaceUp mobile Android build

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ["mobile/**", ".github/workflows/mobile-android.yml"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Generate the native project
        working-directory: mobile
        run: npx expo prebuild -p android --no-install

      - name: Build the release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --console=plain

      - name: Upload the APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaceup-release-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Attach the APK to a rolling prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-v${{ github.run_number }}
          name: VaceUp mobile APK build ${{ github.run_number }}
          prerelease: true
          files: mobile/android/app/build/outputs/apk/release/app-release.apk
