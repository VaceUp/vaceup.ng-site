version: '3.8'

services:
  # ========================================================================
  # POSTGRESQL DATABASE
  # ========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: vaceup-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vaceup}
      POSTGRES_USER: ${POSTGRES_USER:-vaceup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vaceup}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vaceup} -d ${POSTGRES_DB:-vaceup}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vaceup-network

  # ========================================================================
  # REDIS
  # ========================================================================
  redis:
    image: redis:7-alpine
    container_name: vaceup-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vaceup-network

  # ========================================================================
  # DJANGO APPLICATION
  # ========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: vaceup-app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-vaceup}:${POSTGRES_PASSWORD:-vaceup}@postgres:5432/${POSTGRES_DB:-vaceup}
      - REDIS_URL=redis://redis:6379/1
      - REDIS_URL_CELERY=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SIGNING_KEY=${JWT_SIGNING_KEY}
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY}
      - PAYSTACK_PUBLIC_KEY=${PAYSTACK_PUBLIC_KEY}
      - PAYSTACK_CALLBACK_URL=${PAYSTACK_CALLBACK_URL}
      - PAYMENT_CURRENCY=${PAYMENT_CURRENCY:-NGN}
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CELERY_TASK_ALWAYS_EAGER=False
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - LIVEKIT_WS_URL=${LIVEKIT_WS_URL}
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY}
      - PAYSTACK_PUBLIC_KEY=${PAYSTACK_PUBLIC_KEY}
      - PAYSTACK_CALLBACK_URL=${PAYSTACK_CALLBACK_URL}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME}
      - AWS_S3_REGION_NAME=${AWS_S3_REGION_NAME}
      - AWS_S3_ENDPOINT_URL=${AWS_S3_ENDPOINT_URL}
      - SENTRY_DSN=${SENTRY_DSN}
      - SENTRY_ENVIRONMENT=development
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    networks:
      - vaceup-network
    restart: unless-stopped

  # ========================================================================
  # CELERY WORKER
  # ========================================================================
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: vaceup-celery-worker
    command: celery -A config worker -l info -Q default,payments,liveclasses,notifications,emails
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DATABASE_URL=postgresql://${POSTGRES_USER:-vaceup}:${POSTGRES_PASSWORD:-vaceup}@postgres:5432/${POSTGRES_DB:-vaceup}
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CELERY_TASK_ALWAYS_EAGER=False
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    networks:
      - vaceup-network
    restart: unless-stopped

  # ========================================================================
  # CELERY BEAT (SCHEDULER)
  # ========================================================================
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: vaceup-celery-beat
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DATABASE_URL=postgresql://${POSTGRES_USER:-vaceup}:${POSTGRES_PASSWORD:-vaceup}@postgres:5432/${POSTGRES_DB:-vaceup}
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vaceup-network
    restart: unless-stopped

  # ========================================================================
  # NGINX REVERSE PROXY
  # ========================================================================
  nginx:
    image: nginx:alpine
    container_name: vaceup-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - staticfiles:/app/staticfiles:ro
      - media:/app/media:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - vaceup-network
    restart: unless-stopped

  # ========================================================================
  # CERTBOT (SSL CERTIFICATES)
  # ========================================================================
  certbot:
    image: certbot/certbot
    container_name: vaceup-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"
    networks:
      - vaceup-network

volumes:
  postgres_data:
  redis_data:
  staticfiles:
  media:

networks:
  vaceup-network:
    driver: bridge