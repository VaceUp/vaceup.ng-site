apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf-d
  namespace: vaceup
data: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vaceup-config
  namespace: vaceup
data:
  DJANGO_SETTINGS_MODULE: "config.settings"
  CELERY_TASK_ALWAYS_EAGER: "False"
  CELERY_TASK_EAGER_PROPAGATES: "True"
  PAYMENT_CURRENCY: "NGN"
  FRONTEND_BASE_URL: "https://vaceup.ng"
  API_BASE_URL: "https://api.vaceup.ng"
  LIVE_CLASS_REMINDER_LEAD_MINUTES: "30"
  LIVE_CLASS_JOIN_EARLY_MINUTES: "10"
  LIVE_CLASS_JOIN_GRACE_MINUTES: "15"
  CORS_ALLOWED_ORIGINS: "https://vaceup.ng,https://www.vaceup.ng,https://api.vaceup.ng"
---
apiVersion: v1
kind: Secret
metadata:
  name: vaceup-secrets
  namespace: vaceup
type: Opaque
stringData:
  # Database
  DATABASE_URL: "postgresql://vaceup:changeme@postgres:5432/vaceup"
  # Redis
  REDIS_URL: "redis://redis:6379/1"
  CELERY_BROKER_URL: "redis://redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis:6379/0"
  # Security
  SECRET_KEY: "changeme-in-production"
  JWT_SIGNING_KEY: "changeme-in-production"
  # Paystack
  PAYSTACK_SECRET_KEY: ""
  PAYSTACK_PUBLIC_KEY: ""
  PAYSTACK_CALLBACK_URL: "https://vaceup.ng/payment/callback"
  # Email
  EMAIL_HOST: ""
  EMAIL_PORT: "587"
  EMAIL_HOST_USER: ""
  EMAIL_HOST_PASSWORD: ""
  EMAIL_USE_TLS: "True"
  DEFAULT_FROM_EMAIL: "VaceUp <no-reply@vaceup.ng>"
  FRONTEND_BASE_URL: "https://vaceup.ng"
  # LiveKit
  LIVEKIT_API_KEY: ""
  LIVEKIT_API_SECRET: ""
  LIVEKIT_WS_URL: ""
  # S3/R2
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_STORAGE_BUCKET_NAME: "vaceup-media"
  AWS_S3_REGION_NAME: "auto"
  AWS_S3_ENDPOINT_URL: ""
  # Sentry
  SENTRY_DSN: ""
  SENTRY_ENVIRONMENT: "production"
  SENTRY_TRACES_SAMPLE_RATE: "0.1"
  SENTRY_PROFILES_SAMPLE_RATE: "0.05"
  # LiveKit
  LIVEKIT_API_KEY: ""
  LIVEKIT_API_SECRET: ""
  LIVEKIT_WS_URL: ""
  # Paystack
  PAYSTACK_SECRET_KEY: ""
  PAYSTACK_PUBLIC_KEY: ""
  PAYSTACK_CALLBACK_URL: "https://vaceup.ng/payment/callback"
  PAYMENT_CURRENCY: "NGN"
  # Sentry
  SENTRY_DSN: ""
  SENTRY_ENVIRONMENT: "production"
  SENTRY_TRACES_SAMPLE_RATE: "0.10"
  SENTRY_PROFILES_SAMPLE_RATE: "0.05"
  # LiveKit
  LIVEKIT_API_KEY: ""
  LIVEKIT_API_SECRET: ""
  LIVEKIT_WS_URL: ""
  # Paystack
  PAYSTACK_SECRET_KEY: ""
  PAYSTACK_PUBLIC_KEY: ""
  PAYSTACK_CALLBACK_URL: "https://vaceup.ng/payment/callback"
  PAYMENT_CURRENCY: "NGN"