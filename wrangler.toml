# Cloudflare Pages Configuration
# This file configures Cloudflare Pages for the VaceUp frontend
# 
# IMPORTANT: This is for Cloudflare Pages (static hosting), NOT Workers
# The Worker for API proxy is configured separately in wrangler-worker.toml

name = "vaceup-frontend"
compatibility_date = "2026-09-04"

[build]
command = "npm run build"
cwd = "frontend"

pages_build_output_dir = "out"

[build.env]
NEXT_PUBLIC_API_URL = "https://api.vaceup.ng"

[vars]
BACKEND_URL = "https://api.vaceup.ng"